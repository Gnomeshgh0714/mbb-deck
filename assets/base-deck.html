<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DECK_TITLE}}</title>
  <style>
    :root {
      --slide-width: 1600px;
      --slide-height: 900px;
      --margin-x: 72px;
      --title-top: 72px;
      --title-height: 84px;
      --divider-top: 176px;
      --content-top: 206px;
      --content-bottom: 104px;
      --blue-deep: #0A3D8A;
      --blue: #0E58C4;
      --blue-mid: #4A8EF2;
      --blue-bg: #F3F7FC;
      --ink: #17233B;
      --ink-2: #4C5568;
      --muted: #7A8496;
      --line: #D7E0EB;
      --white: #FFFFFF;
      --font-cn: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      --font-action: 24pt;
      --font-subtitle: 14pt;
      --font-body: 14pt;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #E9EEF5;
      font-family: var(--font-cn);
      color: var(--ink);
    }

    #deck {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stage {
      position: relative;
      width: var(--slide-width);
      height: var(--slide-height);
      flex: 0 0 auto;
      transform-origin: center center;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: var(--slide-width);
      height: var(--slide-height);
      overflow: hidden;
      background: var(--white);
      opacity: 0;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .top-rule {
      position: absolute;
      inset: 0 0 auto;
      height: 8px;
      background: var(--blue);
    }

    .title-zone {
      position: absolute;
      top: var(--title-top);
      left: var(--margin-x);
      right: var(--margin-x);
      height: var(--title-height);
      overflow: hidden;
    }

    .action-title {
      width: 100%;
      margin: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: var(--font-action);
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--ink);
    }

    .title-divider {
      position: absolute;
      top: var(--divider-top);
      left: var(--margin-x);
      right: var(--margin-x);
      height: 1px;
      background: var(--line);
    }

    .page-content {
      position: absolute;
      top: var(--content-top);
      left: var(--margin-x);
      right: var(--margin-x);
      bottom: var(--content-bottom);
      overflow: hidden;
    }

    .body-copy { font-size: var(--font-body); line-height: 1.4; }
    .quote-text { font-size: var(--font-body); line-height: 1.45; font-style: italic; }

    .footnote {
      position: absolute;
      left: var(--margin-x);
      bottom: 28px;
      font-size: 9pt;
      line-height: 1.3;
      color: var(--muted);
    }

    .page-no {
      position: absolute;
      right: var(--margin-x);
      bottom: 25px;
      font-size: 10pt;
      line-height: 1.3;
      font-weight: 600;
      color: var(--ink-2);
    }

    .reveal {
      opacity: 0;
      transform: translateY(12px);
    }

    .slide.ready .reveal {
      animation: reveal-up 420ms cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes reveal-up {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }
    }

    @media print {
      @page { size: 16in 9in; margin: 0; }
      html, body { height: auto; overflow: visible; background: #FFFFFF; }
      #deck { position: static; display: block; }
      #stage { width: 1600px; height: auto; transform: none !important; }
      .slide {
        position: relative;
        display: block;
        opacity: 1;
        pointer-events: auto;
        page-break-after: always;
      }
      .reveal {
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
      }
    }
  </style>
  <style>
    #deck { padding-bottom: 52px; }
    #nav { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px; z-index: 10;
      background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(23, 35, 59, 0.14);
      border-radius: 6px; padding: 5px 12px; user-select: none;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    #nav button { width: 26px; height: 26px; border: none; border-radius: 4px;
      background: rgba(23, 35, 59, 0.08); color: #4C5568; font-size: 15px;
      line-height: 1; cursor: pointer; padding: 0; font-family: inherit; }
    #nav button:hover:not(:disabled) { background: #0E58C4; color: #FFFFFF; }
    #nav button:disabled { opacity: 0.3; cursor: default; }
    #nav span { font-size: 12.5px; color: #4C5568; min-width: 46px; text-align: center; }
    @media print {
      #nav { display: none !important; }
      #deck { padding-bottom: 0 !important; }
    }
  </style>
</head>
<body>
  <main id="deck">
    <div id="stage">
      <section class="slide active" aria-label="{{PAGE_LABEL}}">
        <div class="top-rule"></div>
        <div class="title-zone">
          <h1 class="action-title">{{ACTION_TITLE}}</h1>
        </div>
        <div class="title-divider"></div>

        <div class="page-content">
          <!-- Insert the page-specific exhibit here. -->
        </div>

        <div class="footnote">{{SOURCE}}</div>
        <div class="page-no">{{PAGE_NO}}</div>
      </section>
    </div>
  </main>
  <nav id="nav" aria-label="翻页控制">
    <button id="nav-prev" type="button" aria-label="上一页">‹</button>
    <span id="nav-indicator">1 / 1</span>
    <button id="nav-next" type="button" aria-label="下一页">›</button>
  </nav>

  <script>
    const slides = Array.from(document.querySelectorAll('.slide'));
    const NAV_CHROME = 52;
    let current = 0;
    let wheelLock = 0;

    function fitStage() {
      const scale = Math.min(window.innerWidth / 1600,
        (window.innerHeight - NAV_CHROME) / 900);
      document.getElementById('stage').style.transform = `scale(${scale})`;
    }

    function updateNav() {
      const prev = document.getElementById('nav-prev');
      const next = document.getElementById('nav-next');
      const ind = document.getElementById('nav-indicator');
      if (prev) prev.disabled = current === 0;
      if (next) next.disabled = current === slides.length - 1;
      if (ind) ind.textContent = (current + 1) + ' / ' + slides.length;
    }

    function showSlide(index) {
      current = Math.max(0, Math.min(index, slides.length - 1));
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === current);
        slide.classList.remove('ready');
      });
      window.setTimeout(() => slides[current].classList.add('ready'), 40);
      updateNav();
    }

    window.addEventListener('resize', fitStage);
    window.addEventListener('keydown', (event) => {
      if (event.target && event.target.tagName === 'BUTTON') return;
      if (['ArrowRight', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
        showSlide(current + 1);
      } else if (['ArrowLeft', 'PageUp'].includes(event.key)) {
        event.preventDefault();
        showSlide(current - 1);
      } else if (event.key === 'Home') {
        showSlide(0);
      } else if (event.key === 'End') {
        showSlide(slides.length - 1);
      }
    });

    window.addEventListener('wheel', (event) => {
      const now = Date.now();
      if (now < wheelLock || Math.abs(event.deltaY) < 6) return;
      wheelLock = now + 480;
      showSlide(current + (event.deltaY > 0 ? 1 : -1));
    }, { passive: true });

    let touchX = null, touchY = null;
    window.addEventListener('touchstart', (event) => {
      if (event.touches.length === 1) {
        touchX = event.touches[0].clientX;
        touchY = event.touches[0].clientY;
      }
    }, { passive: true });
    window.addEventListener('touchend', (event) => {
      if (touchX === null) return;
      const dx = event.changedTouches[0].clientX - touchX;
      const dy = event.changedTouches[0].clientY - touchY;
      touchX = touchY = null;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) {
        showSlide(current + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    document.getElementById('deck').addEventListener('click', (event) => {
      if (event.target.closest('#nav')) return;
      if (window.getSelection && String(window.getSelection())) return;
      showSlide(current + 1);
    });
    document.getElementById('nav-prev').addEventListener('click', () => showSlide(current - 1));
    document.getElementById('nav-next').addEventListener('click', () => showSlide(current + 1));

    fitStage();
    showSlide(0);
  </script>
</body>
</html>
