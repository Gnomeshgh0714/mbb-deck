<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>BD · section</title>
<style id="bd-section-css">
  /* BD 固定页 · section（pptx 机械还原，行内样式零类名冲突；拼装时拷本块与下方 section） */
  .bd-slide.bd-section{position:relative;width:1600px;height:900px;overflow:hidden;font-family:'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;background:#FFFFFF;}
  .bd-slide.bd-section p{line-height:1.25}
  .bd-slide.bd-section img{position:absolute;object-fit:fill}
</style>
</head>
<body style="margin:0;background:#E8EBF0">
<!-- 拼装起点 -->
<section class="slide bd-slide bd-section">
<div style="position:absolute;left:0.0px;top:336.0px;width:1600.0px;height:228.0px;;box-sizing:border-box;background:rgba(224,235,246,0.18);display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;padding:6.0px 12.0px 6.0px 12.0px;"><p style="margin:0;height:0.6em"></p></div>
  <div style="position:absolute;left:723.2px;top:455.2px;width:835.1px;height:99.2px;;box-sizing:border-box;background:none;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;padding:6.0px 12.0px 6.0px 12.0px;"><p style="margin:0;text-align:left;line-height:1.20"><span style="font-size:60.0px;font-weight:700;color:#30356D;font-family:'微软雅黑','Microsoft YaHei','PingFang SC',sans-serif"><span style="letter-spacing:10.0px"></span>{{SECTION_TITLE}}</span></p></div>
  <div style="position:absolute;left:723.3px;top:267.3px;width:188.5px;height:173.5px;;box-sizing:border-box;background:none;padding:6.0px 12.0px 6.0px 12.0px;white-space:nowrap;"><p style="margin:0;text-align:left"><span style="font-size:133.3px;font-weight:700;color:#0E58C4;font-family:'微软雅黑','Microsoft YaHei','PingFang SC',sans-serif">{{SECTION_NO}}</span></p></div>
  <img src="img/image24.png" style="position:absolute;left:-243.9px;top:123.5px;width:889.1px;height:889.1px;transform:rotate(346.3deg);object-fit:fill">
</section>
<!-- 拼装终点 -->
</body>
</html>
