<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🔲 待填 · deck 标题</title>
<!--
  mbb-deck · 单文件 HTML deck 脚手架（框架版）
  ─────────────────────────────────────────────
  结构（已定，可直接使用）：
    · 1920×1080 画布，16:9，无纵向滚动
    · 每页 .slide = 标题带 .title-band + 内容区 .content（12 列网格）+ 页脚带 .footer-band
    · 键盘 ←/→ 翻页，零外部依赖
  设计令牌（🔲 待填，不得用于正式输出）：
    · :root 下的色彩/字级令牌当前为中性占位值，仅供脚手架验证
    · 定稿后按 references/design-system.md §1–§3 回填三套预设
    · 回填预设 A 时替换 :root 默认值；预设 B/C 以 body.preset-b / body.preset-c 覆盖
-->
<style>
  /* ================= 设计令牌 🔲 待填区 ================= */
  :root {
    /* 色彩（预设 A · Executive Classic · 默认）
       🔲 待填 -- 来源：skills整合.md 5.1 预设A；当前为中性占位值 */
    --paper:     #ffffff;
    --surface:   #ffffff;
    --ink:       #111111;
    --navy:      #111111;
    --blue:      #333333;
    --muted:     #666666;
    --line:      #dddddd;
    --soft:      #f0f0f0;
    --risk:      #990000;
    --positive:  #006600;

    /* 字级（px）
       🔲 待填 -- 来源：skills整合.md 5.2 字级表（pt 按 1pt≈1.333px 换算）；当前为结构性占位 */
    --fs-cover-title: 64px;
    --fs-action-title: 36px;
    --fs-section-title: 46px;
    --fs-callout: 23px;
    --fs-body: 18px;
    --fs-chart-label: 14px;
    --fs-source-note: 11px;

    /* 字族
       🔲 待填 -- 来源：skills整合.md 5.2（定稿后指定；须为系统字体栈，禁止外链字体） */
    --font-title: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-body:  "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-num:   "Helvetica Neue", Arial, sans-serif;

    /* 网格与间距
       🔲 待填 -- 来源：skills整合.md 5.3（4pt 基础单位、步进、边距下限；当前为结构性占位） */
    --grid-columns: 12;
    --grid-gap: 24px;
    --margin-x: 64px;        /* 左右边距相等（对称原则） */
    --band-gap: 24px;        /* 标题带/页脚带与内容区的间隔 */
  }
  /* 预设 B · McKinsey Navy 🔲 待填 -- 定稿后在 body.preset-b 下覆盖令牌 */
  /* 预设 C · MBB Navy/Teal 🔲 待填 -- 定稿后在 body.preset-c 下覆盖令牌 */

  /* ================= 页面框架（已定） ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--fs-body);
    -webkit-font-smoothing: antialiased;
  }
  .deck { width: 1920px; height: 1080px; position: relative; }
  .slide {
    display: none;
    width: 1920px; height: 1080px;
    padding: 0 var(--margin-x);
    flex-direction: column;
  }
  .slide.active { display: flex; }

  /* 标题带（action title 落位处；每页必须有，且为结论句） */
  .title-band {
    flex: 0 0 auto;
    padding: 40px 0 var(--band-gap);
    border-bottom: 1px solid var(--line); /* 🔲 待填：细分隔线粗细（0.5–1pt），定稿后确认 */
  }
  .title-band h1 {
    font-family: var(--font-title);
    font-size: var(--fs-action-title);
    color: var(--navy);
    line-height: 1.3; /* 一行标题保持一行；意外换行 = 版面质量门 blocker */
  }

  /* 内容区：12 列网格（版式组件在 .content 内按 layout-catalog.md 契约搭建） */
  .content {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(var(--grid-columns), 1fr);
    gap: var(--grid-gap);
    padding: var(--band-gap) 0;
    min-height: 0;
  }

  /* 页脚带：左下来源注 + 右下页码（数据页来源注必填） */
  .footer-band {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: var(--band-gap) 0 32px;
    border-top: 1px solid var(--line);
  }
  .footer-band .source-note {
    font-size: var(--fs-source-note);
    color: var(--muted);
  }
  .footer-band .page-no {
    font-family: var(--font-num);
    font-size: var(--fs-source-note);
    color: var(--muted);
  }

  /* 封面页变体（无标题带边线，居中构图） */
  .slide.cover { justify-content: center; }
  .slide.cover .cover-title {
    font-family: var(--font-title);
    font-size: var(--fs-cover-title);
    color: var(--navy);
  }

  /* ================= 翻页逻辑（已定，零依赖） ================= */
</style>
</head>
<body>
<div class="deck">

  <!-- 示例封面页（结构占位，内容 🔲 待填） -->
  <section class="slide cover active">
    <div class="cover-title">🔲 待填 · 封面主标题</div>
    <div style="margin-top:24px; color:var(--muted);">🔲 待填 · 副标题（受众/日期）</div>
  </section>

  <!-- 示例内容页（结构占位；正式页按 plan.json 的 layout 填充 .content） -->
  <section class="slide">
    <header class="title-band">
      <h1>🔲 待填 · 本页 action title（结论句，非话题标签）</h1>
    </header>
    <main class="content">
      <!-- 版式组件落位区：Why / How / So-What 分区 + Layer1 数据层 + Layer2 overlay -->
    </main>
    <footer class="footer-band">
      <div class="source-note">🔲 待填 · 来源注（数据页必填）</div>
      <div class="page-no">2 / N</div>
    </footer>
  </section>

</div>
<script>
  /* 键盘翻页（←/→），零依赖；不改动此段 */
  (function () {
    var slides = document.querySelectorAll('.slide');
    var cur = 0;
    function show(i) {
      if (i < 0 || i >= slides.length) return;
      slides[cur].classList.remove('active');
      cur = i;
      slides[cur].classList.add('active');
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') show(cur + 1);
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(cur - 1);
    });
  })();
</script>
</body>
</html>
